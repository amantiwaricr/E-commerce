# One server, one domain — the simplest deployment that works, and the one
# that avoids third-party-cookie problems entirely: the SPA and the API share
# an origin, so the session cookie is first-party and needs no SameSite=None.
#
#   /            the storefront   (client/dist)
#   /admin/      the admin panel  (admin/dist)
#   /api/        the Node API     (127.0.0.1:5000)
#
# TLS terminates here. Get a certificate with:
#   certbot --nginx -d freshmeatnepal.com -d www.freshmeatnepal.com

server {
    listen 80;
    server_name freshmeatnepal.com www.freshmeatnepal.com;
    # Certbot rewrites this to a 301 to https once a certificate exists.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name freshmeatnepal.com www.freshmeatnepal.com;

    ssl_certificate     /etc/letsencrypt/live/freshmeatnepal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshmeatnepal.com/privkey.pem;
    # 1.0 and 1.1 are deprecated and fail a PCI scan.
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/fresh-meat-nepal/client;
    index index.html;

    # Product photographs uploaded through the admin panel.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Load-bearing: the API reads this to know the visitor arrived over
        # TLS. Without it `req.secure` is false, the HTTPS redirect loops and
        # `secure` cookies are never set.
        proxy_set_header X-Forwarded-Proto $scheme;
        # A PDF invoice takes a moment to render.
        proxy_read_timeout 60s;
    }

    location /admin/ {
        alias /var/www/fresh-meat-nepal/admin/;
        try_files $uri $uri/index.html /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Hashed filenames, so these bytes never change.
    #
    # One directive, not `expires` plus `add_header`: `expires` writes its own
    # Cache-Control and wins, which silently dropped `immutable` — the part
    # that stops the browser revalidating a file that cannot have changed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: a real file if there is one — which includes every route
    # `npm run build` pre-rendered — and index.html otherwise.
    #
    # `$uri/index.html` rather than `$uri/`. The directory form makes nginx
    # answer /shop with a 301 to /shop/, while the pre-rendered page declares
    # its canonical as /shop — so the URL search engines are told to index
    # redirects somewhere else, and the redirect carries the raw host and port.
    # Naming index.html serves the same file at the canonical URL directly.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
