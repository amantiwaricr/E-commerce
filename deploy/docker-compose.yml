# The API and a database on one machine. The two front-ends are static files:
# build them and serve them with nginx (see nginx.conf) or a static host.
#
#   docker compose --env-file ../server/.env up -d --build

services:
  api:
    build: ../server
    restart: unless-stopped
    # Bound to localhost: nginx is what faces the internet, and an API port
    # open to the world would bypass its TLS entirely.
    ports: ['127.0.0.1:5000:5000']
    env_file: ../server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/fresh-meat-nepal
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo: { condition: service_healthy }

  mongo:
    image: mongo:7
    restart: unless-stopped
    # No published port at all — only the API, on the compose network, talks
    # to it. An exposed MongoDB is found by scanners within hours.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  mongo-data:
