<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Fresh Meat Nepal — farm-fresh and processed meat delivered across Kathmandu Valley. Pay with eSewa, card, or cash on delivery."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Fresh Meat Nepal — Fresh meat delivered across Kathmandu</title>
  </head>
  <body>
    <script>
      // Applies the stored theme before the first paint, so a reader who chose
      // dark mode never gets a flash of the light palette. Light is the
      // default; the same rule lives in ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('fmn_theme');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
